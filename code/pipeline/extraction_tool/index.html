<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C-2.3 Reviewer Tool</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --border: #2a2f3a;
    --fg: #e6e9ef; --muted: #8b93a3; --accent: #5b9dff; --accent2: #3a7bd5;
    --ok: #46c46a; --warn: #f0b948; --dim: 0.4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header .sp { flex: 1; }
  select, button, input, textarea { font: inherit; color: var(--fg); }
  select, input, textarea { background: var(--panel2); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 8px; }
  textarea { width: 100%; resize: vertical; min-height: 48px; }
  button { background: var(--accent2); border: 1px solid var(--accent2); color: #fff;
    border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button.ghost { background: transparent; border-color: var(--border); color: var(--fg); }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: .4; cursor: default; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .pill.blind { color: var(--accent); border-color: var(--accent); }
  .pill.verification { color: var(--warn); border-color: var(--warn); }
  .pill.done { color: var(--ok); border-color: var(--ok); }
  .pill.ai_blind_test { color: #c58bff; border-color: #c58bff; }
  .modebar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center;
    gap: 10px; margin: -14px -16px 12px; padding: 8px 16px; font-size: 12px;
    background: var(--panel); border-bottom: 1px solid var(--border); }
  .modebar .sp { flex: 1; }
  .modebar .modelabel { font-weight: 600; letter-spacing: .3px; }
  .modebar.blind .modelabel { color: var(--accent); }
  .modebar.committed .modelabel, .modebar.revealed .modelabel { color: var(--warn); }
  .modebar.finalised .modelabel { color: var(--ok); }
  .field.cmp { display: grid; grid-template-columns: 1fr 230px; gap: 10px; }
  .aicol { border-left: 1px dashed var(--border); padding-left: 10px; font-size: 12px; }
  .aival { margin-bottom: 5px; overflow-wrap: anywhere; }
  .aim { color: var(--warn); font-weight: 600; }
  main { display: flex; height: calc(100% - 49px); }
  #pdf { width: 50%; border: none; background: #fff; }
  #formwrap { width: 50%; overflow-y: auto; padding: 14px 16px 80px; }
  .section { margin-bottom: 18px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel); overflow: hidden; }
  .section.dim { opacity: var(--dim); }
  .section > h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px;
    margin: 0; padding: 8px 12px; background: var(--panel2); color: var(--muted);
    border-bottom: 1px solid var(--border); }
  .field { padding: 9px 12px; border-bottom: 1px solid var(--border); }
  .field:last-child { border-bottom: none; }
  .field > label { display: block; font-weight: 600; margin-bottom: 4px; }
  .field .help { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .evidence { margin-top: 9px; padding: 8px; border: 1px solid var(--accent2);
    border-radius: 6px; background: rgba(58, 123, 213, .08); }
  .evidence-title { color: var(--accent); font-size: 11px; font-weight: 600;
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: .3px; }
  .evidence-mode { display: grid; grid-template-columns: 110px minmax(0, 1fr);
    align-items: center; gap: 6px; margin-bottom: 6px; color: var(--muted); font-size: 12px; }
  .absence-help { color: var(--muted); font-size: 11px; margin-bottom: 6px; }
  .hidden { display: none; }
  .evidence-row { display: grid; grid-template-columns: 130px 1fr; gap: 6px; margin-top: 6px; }
  .checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .checks label { font-weight: 400; display: inline-flex; align-items: center; gap: 5px; }
  .row { display: flex; gap: 6px; align-items: center; margin-bottom: 5px; }
  .row input { flex: 1; }
  .row button { padding: 4px 9px; }
  .obj { border: 1px dashed var(--border); border-radius: 6px; padding: 8px; margin-bottom: 6px; }
  .obj .gr { display: grid; grid-template-columns: 130px 1fr; gap: 5px 8px; align-items: center; margin-bottom: 4px; }
  .savebar { position: fixed; bottom: 0; right: 0; width: 50%; display: flex; gap: 12px;
    align-items: center; padding: 10px 16px; background: var(--panel);
    border-top: 1px solid var(--border); }
  .savebar .sp { flex: 1; }
  .savebar label { display: inline-flex; gap: 6px; align-items: center; }
  #status { color: var(--muted); font-size: 12px; }
  #save-state { color: var(--muted); font-size: 12px; }
  #save-state.clean { color: var(--ok); }
  #save-state.dirty, #save-state.recovered { color: var(--warn); }
  #save-state.failed { color: #ff6b6b; }
  .tri { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .tri button { background: var(--panel2); border: none; border-right: 1px solid var(--border);
    border-radius: 0; color: var(--muted); padding: 4px 12px; }
  .tri button:last-child { border-right: none; }
  .tri button.on { background: var(--accent2); color: #fff; }
</style>
</head>
<body>
<header>
  <h1>C-2.3 Reviewer Extraction</h1>
  <span id="progress" class="pill"></span>
  <span class="sp"></span>
  <button class="ghost" id="prev">← Prev</button>
  <select id="picker"></select>
  <button class="ghost" id="next">Next →</button>
</header>
<main>
  <iframe id="pdf" title="PDF"></iframe>
  <div id="formwrap">
    <div id="modebar" class="modebar"></div>
    <div id="meta" style="margin-bottom:12px"></div>
    <div id="form"></div>
  </div>
</main>
<div class="savebar">
  <span id="status"></span>
  <span id="save-state" class="save-state"></span>
  <span class="sp"></span>
  <label><input type="checkbox" id="done"> mark done</label>
  <button id="save">Save (⌘S)</button>
</div>
<script src="/app.js"></script>
</body>
</html>
